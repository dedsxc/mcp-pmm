[project]
name = "mcp-pmm"
version = "0.1.0"
description = "MCP server for Percona Monitoring and Management (PMM) API"
authors = [{ name = "Kien N", email = "contact@kien.cc" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-pmm = "mcp_pmm.server:main"
mcp-pmm-sse = "mcp_pmm.server:main_sse"
mcp-pmm-http = "mcp_pmm.server:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pmm"]
